<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Royal Auto — Admin</title>
<link rel="icon" type="image/png" href="/uploads/logo.png" />
<link rel="stylesheet" href="/css/style.css" />
<style>
  .admin-shell { display: none; }
  .admin-shell.visible { display: block; }
  .admin-toolbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 24px 0; flex-wrap: wrap; gap: 14px;
  }
  .listing-form {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: var(--radius); padding: 26px; margin-bottom: 40px;
  }
  .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-actions { display: flex; gap: 12px; margin-top: 20px; }
  .table-wrap { border: 1px solid var(--card-border); border-radius: var(--radius); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--card-border); }
  th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: .05em; background: var(--bg-elevated); }
  tr:last-child td { border-bottom: none; }
  .thumb { width: 56px; height: 40px; border-radius: 4px; background: #0e0e0f center/cover no-repeat; }
  .row-actions { display: flex; gap: 8px; }
  .status-pill { font-size: 11px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--card-border); text-transform: capitalize; }
  .status-pill.available { border-color: var(--success); color: var(--success); }
  .status-pill.reserved { border-color: var(--gold); color: var(--gold-bright); }
  .status-pill.sold { border-color: var(--danger); color: var(--danger); }
  .image-preview-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .image-preview { position: relative; width: 84px; height: 60px; border-radius: 6px; overflow: hidden; border: 1px solid var(--card-border); }
  .image-preview img { width: 100%; height: 100%; object-fit: cover; }
  .image-preview .remove-img {
    position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%;
    background: rgba(0,0,0,.7); color: #fff; border: none; font-size: 12px; cursor: pointer; line-height: 1;
  }
  label.form-label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display:block; margin-bottom:6px; }
</style>
</head>
<body>

<!-- Login gate -->
<div class="modal-overlay open" id="loginOverlay">
  <div class="modal auth-modal">
    <div class="modal-body">
      <img class="brand-mark" src="/uploads/logo.png" alt="Royal Auto" onerror="this.style.display='none'" />
      <h2 data-i18n="admin_signin_title">Admin sign-in</h2>
      <p style="margin-bottom:22px;" data-i18n="admin_signin_sub">Manage Royal Auto listings.</p>
      <form id="loginForm">
        <div class="field" style="margin-bottom:14px; text-align:left;">
          <label for="username" data-i18n="admin_username">Username</label>
          <input type="text" id="username" autocomplete="username" required />
        </div>
        <div class="field" style="margin-bottom:20px; text-align:left;">
          <label for="password" data-i18n="admin_password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
        <button class="btn btn-gold btn-block" type="submit" data-i18n="admin_signin_btn">Sign in</button>
        <p id="loginError" style="color:var(--danger); margin-top:14px; display:none;" data-i18n="admin_login_error">Invalid username or password.</p>
      </form>
    </div>
  </div>
</div>

<div class="admin-shell" id="adminShell">
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/admin">
        <img src="/uploads/logo.png" alt="Royal Auto crest" onerror="this.style.display='none'" />
        <div class="brand-text">
          <span class="name">ROYAL <span class="auto">AUTO</span></span>
          <span class="tagline" data-i18n="admin_tagline">Admin Panel</span>
        </div>
      </a>
      <nav class="nav-links">
        <a href="/" target="_blank" data-i18n="nav_view_site">View site ↗</a>
        <button class="btn btn-outline btn-sm" id="logoutBtn" data-i18n="admin_logout">Log out</button>
        <div class="lang-toggle">
          <button data-lang-btn="en">EN</button>
          <button data-lang-btn="fr">FR</button>
        </div>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="admin-toolbar">
      <h2 style="margin:0;" data-i18n="admin_listings_title">Listings</h2>
      <button class="btn btn-gold" id="newListingBtn" data-i18n="admin_add_new">+ Add new car</button>
    </div>

    <form class="listing-form" id="listingForm" style="display:none;">
      <h3 id="formTitle" style="margin-bottom:20px;" data-i18n="admin_add_title">Add new car</h3>
      <input type="hidden" id="listingId" />
      <div class="form-grid">
        <div>
          <label class="form-label" for="title" data-i18n="admin_field_title">Listing title</label>
          <input id="title" placeholder="e.g. 2021 BMW 320i M Sport" required />
        </div>
        <div>
          <label class="form-label" for="brand" data-i18n="admin_field_brand">Brand</label>
          <input id="brand" placeholder="BMW" required />
        </div>
        <div>
          <label class="form-label" for="model" data-i18n="admin_field_model">Model</label>
          <input id="model" placeholder="320i" required />
        </div>
        <div>
          <label class="form-label" for="year" data-i18n="admin_field_year">Year</label>
          <input id="year" type="number" min="1970" max="2030" required />
        </div>
        <div>
          <label class="form-label" for="price" data-i18n="admin_field_price">Price (TND)</label>
          <input id="price" type="number" min="0" required />
        </div>
        <div>
          <label class="form-label" for="mileage" data-i18n="admin_field_mileage">Mileage (km)</label>
          <input id="mileage" type="number" min="0" />
        </div>
        <div>
          <label class="form-label" for="fuel" data-i18n="admin_field_fuel">Fuel</label>
          <select id="fuel">
            <option value="" data-i18n="admin_select">Select…</option>
            <option value="Petrol" data-i18n="admin_fuel_petrol">Petrol</option>
            <option value="Diesel" data-i18n="admin_fuel_diesel">Diesel</option>
            <option value="Hybrid" data-i18n="admin_fuel_hybrid">Hybrid</option>
            <option value="Electric" data-i18n="admin_fuel_electric">Electric</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="transmission" data-i18n="admin_field_transmission">Transmission</label>
          <select id="transmission">
            <option value="" data-i18n="admin_select">Select…</option>
            <option value="Manual" data-i18n="admin_trans_manual">Manual</option>
            <option value="Automatic" data-i18n="admin_trans_auto">Automatic</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="color" data-i18n="admin_field_color">Color</label>
          <input id="color" placeholder="Black" />
        </div>
        <div>
          <label class="form-label" for="status" data-i18n="admin_field_status">Status</label>
          <select id="status">
            <option value="available" data-i18n="status_available">Available</option>
            <option value="reserved" data-i18n="status_reserved">Reserved</option>
            <option value="sold" data-i18n="status_sold">Sold</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="phone" data-i18n="admin_field_phone">Phone (for calls)</label>
          <input id="phone" placeholder="+216 20 000 000" />
        </div>
        <div>
          <label class="form-label" for="whatsapp" data-i18n="admin_field_whatsapp">WhatsApp number</label>
          <input id="whatsapp" placeholder="21620000000" />
        </div>
        <div class="full">
          <label class="form-label" for="description" data-i18n="admin_field_description">Description</label>
          <textarea id="description" rows="4" placeholder="Condition, service history, extras…"></textarea>
        </div>
        <div class="full">
          <label class="form-label" for="images" data-i18n="admin_field_photos">Photos</label>
          <input id="images" type="file" accept="image/*" multiple />
          <div class="image-preview-row" id="existingImages"></div>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-gold" data-i18n="admin_save">Save listing</button>
        <button type="button" class="btn btn-outline" id="cancelFormBtn" data-i18n="admin_cancel">Cancel</button>
      </div>
    </form>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th></th>
            <th data-i18n="admin_field_title">Title</th>
            <th data-i18n="admin_table_year">Year</th>
            <th data-i18n="admin_table_price">Price</th>
            <th data-i18n="admin_table_status">Status</th>
            <th data-i18n="admin_table_posted">Posted</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="listingsTableBody"></tbody>
      </table>
    </div>
  </div>

  <div style="height:60px;"></div>
</div>

<div class="toast" id="toast"></div>

<script src="/js/i18n.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
